# log frequency
val_check_interval: 1
progress_bar_refresh_rate: 1

wandb:
  name: ${expname}
  project: diffcsp
  # entity: null
  log_model: False
  mode: 'offline'
  group: ${expname}
  save_dir: ${wandb_dir}

wandb_watch:
  log: 'all'
  log_freq: 500

lr_monitor:
  logging_interval: "step"
  log_momentum: False
