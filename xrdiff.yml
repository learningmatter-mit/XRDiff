name: xrdiff
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.9
  - pip
  - pip:
    # PyTorch 2.1.0 + CUDA 11.8 wheels (compatible with CUDA driver >= 11.8, including 12.x)
    - --extra-index-url https://download.pytorch.org/whl/cu118
    # PyG sparse extensions built for torch 2.1.0 + cu118
    - --find-links https://data.pyg.org/whl/torch-2.1.0+cu118.html
    - torch==2.1.0+cu118
    - torchvision==0.16.0+cu118
    - torchaudio==2.1.0+cu118
    - torch_geometric==2.5.2
    - torch_scatter
    - torch_sparse
    # Training framework
    - pytorch-lightning==2.0.3
    - torchmetrics==1.1.2
    - einops==0.7.0
    # Crystal structure / chemistry
    - pymatgen==2024.4.13
    - matminer==0.9.2
    - smact==2.5.5
    - pyxtal==0.6.7
    - spglib==2.4.0
    - ase==3.22.1
    - chemparse==0.3.1
    - symd==1.1.0
    # Config / experiment management
    - hydra-core==1.3.2
    - omegaconf==2.3.0
    - wandb==0.21.0
    # Data / numerical
    - numpy==1.26.4
    - pandas==2.2.2
    - scipy==1.13.0
    - scikit-learn==1.4.2
    - datasets==4.4.2
    - p-tqdm==1.4.0
    - tqdm
    - python-dotenv==1.0.0
    # Plotting
    - matplotlib==3.8.4
    - plotly==5.21.0